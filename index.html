<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Typeflow — a desktop typing trainer for a physical keyboard." />
    <meta name="theme-color" content="#0E1214" />
    <title>typeflow</title>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('typeflow:settings') || '{}')
        if (s.theme === 'light') document.documentElement.classList.add('light')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
